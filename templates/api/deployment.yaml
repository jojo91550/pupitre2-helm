apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pupitre.fullname" . }}-api
  labels:
    {{- include "pupitre.api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  strategy:
    {{- toYaml .Values.api.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "pupitre.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pupitre.api.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.api.service.port }}"
        prometheus.io/path: "/metrics"
        # Restart the pods when the configuration changes.
        checksum/config: {{ include (print $.Template.BasePath "/api/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "pupitre.fullname" . }}-api
      automountServiceAccountToken: false
      securityContext:
        # Makes the uploads volume writable by the API's user.
        fsGroup: 1000
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: api
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.api.image.pullPolicy }}
        securityContext:
          {{- include "pupitre.securityContext" (dict "uid" 1000) | nindent 10 }}
        ports:
        - name: http
          containerPort: {{ .Values.api.service.port }}
          protocol: TCP
        env:
        - name: CONFIG_PATH
          value: /etc/pupitre/config.yaml
        - name: LOG_LEVEL
          value: {{ .Values.api.env.LOG_LEVEL | quote }}
        - name: LOG_FORMAT
          value: {{ .Values.api.env.LOG_FORMAT | quote }}
        - name: GITLAB_BASE_URL
          value: {{ .Values.api.env.GITLAB_BASE_URL | quote }}
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "pupitre.jwtSecretName" . }}
              key: {{ include "pupitre.jwtSecretKey" . }}
        - name: OAUTH_REDIRECT_BASE
          value: {{ .Values.sso.redirectBase | default (include "pupitre.publicUrl" .) | quote }}
        {{- if .Values.sso.oidc.enabled }}
        # OIDC bootstrap — seeded into platform_settings on startup. The client
        # secret is mounted as a file (OIDC_CLIENT_SECRET_FILE), never an env var.
        - name: OIDC_ENABLED
          value: "true"
        - name: OIDC_PROVIDER_URL
          value: {{ .Values.sso.oidc.providerURL | quote }}
        {{- if .Values.sso.oidc.issuerURL }}
        - name: OIDC_ISSUER_URL
          value: {{ .Values.sso.oidc.issuerURL | quote }}
        {{- end }}
        - name: OIDC_CLIENT_ID
          value: {{ .Values.sso.oidc.clientID | quote }}
        - name: OIDC_SCOPES
          value: {{ .Values.sso.oidc.scopes | quote }}
        - name: OIDC_GROUP_CLAIM
          value: {{ .Values.sso.oidc.groupClaim | quote }}
        {{- if .Values.sso.oidc.groupAdmins }}
        - name: OIDC_GROUP_ADMINS
          value: {{ .Values.sso.oidc.groupAdmins | quote }}
        {{- end }}
        {{- if .Values.sso.oidc.browserBaseURL }}
        - name: OIDC_BROWSER_BASE_URL
          value: {{ .Values.sso.oidc.browserBaseURL | quote }}
        {{- end }}
        {{- if .Values.sso.oidc.redirectBase }}
        - name: OIDC_REDIRECT_BASE
          value: {{ .Values.sso.oidc.redirectBase | quote }}
        {{- end }}
        - name: OIDC_CLIENT_SECRET_FILE
          value: /etc/oidc/OIDC_CLIENT_SECRET
        {{- if .Values.sso.oidc.insecureSkipVerify }}
        - name: OIDC_INSECURE_SKIP_VERIFY
          value: "true"
        {{- end }}
        {{- end }}
        {{- if .Values.sso.enabled }}
        {{- range .Values.sso.providers }}
        {{- if or .clientSecret .existingSecret }}
        - name: SSO_{{ .id | upper }}_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              {{- if .existingSecret }}
              name: {{ .existingSecret | quote }}
              key: {{ .existingSecretKey | default "clientSecret" | quote }}
              {{- else }}
              name: {{ include "pupitre.fullname" $ }}-secrets
              key: SSO_{{ .id | upper }}_CLIENT_SECRET
              {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "pupitre.databaseUrlSecretName" . }}
              key: {{ include "pupitre.databaseUrlSecretKey" . }}
        {{- if eq (include "pupitre.gitTokenEnabled" .) "true" }}
        - name: GIT_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "pupitre.gitTokenSecretName" . }}
              key: {{ include "pupitre.gitTokenSecretKey" . }}
        {{- end }}
        - name: GITLAB_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "pupitre.fullname" . }}-secrets
              key: GITLAB_TOKEN
              optional: true
        # ADMIN_PASSWORD is exposed as a file (not an env var) so the kubelet
        # refreshes it automatically when the Secret changes — no pod restart needed.
        - name: ADMIN_PASSWORD_FILE
          value: /etc/admin-password/ADMIN_PASSWORD
        {{- with .Values.api.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        volumeMounts:
        - name: config
          mountPath: /etc/pupitre
          readOnly: true
        - name: admin-password
          mountPath: /etc/admin-password
          readOnly: true
        {{- if .Values.sso.oidc.enabled }}
        - name: oidc-secret
          mountPath: /etc/oidc
          readOnly: true
        {{- end }}
        - name: git-credentials
          mountPath: /etc/git-credentials
          readOnly: true
        # The git cache of the courses.
        - name: tmp
          mountPath: /tmp
        - name: uploads
          mountPath: /data/uploads
        {{- with .Values.api.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        startupProbe:
          httpGet:
            path: /health
            port: http
          failureThreshold: 30
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 3
        resources:
          {{- toYaml .Values.api.resources | nindent 10 }}
      # The API drains its requests within 15 s of SIGTERM.
      terminationGracePeriodSeconds: 30
      volumes:
      - name: config
        configMap:
          name: {{ include "pupitre.fullname" . }}-api-config
      # Admin password secret — mounted as a file so the kubelet can refresh it
      # live when the Secret is updated (no pod restart required).
      - name: admin-password
        secret:
          {{- if .Values.admin.existingSecret }}
          secretName: {{ .Values.admin.existingSecret | quote }}
          items:
            - key: {{ .Values.admin.existingSecretKey | quote }}
              path: ADMIN_PASSWORD
          {{- else }}
          secretName: {{ include "pupitre.fullname" . }}-secrets
          items:
            - key: ADMIN_PASSWORD
              path: ADMIN_PASSWORD
          {{- end }}
      {{- if .Values.sso.oidc.enabled }}
      # OIDC client secret — mounted as a file so it never appears in the pod env.
      - name: oidc-secret
        secret:
          {{- if .Values.sso.oidc.existingSecret }}
          secretName: {{ .Values.sso.oidc.existingSecret | quote }}
          items:
            - key: {{ .Values.sso.oidc.existingSecretKey | quote }}
              path: OIDC_CLIENT_SECRET
          {{- else }}
          secretName: {{ include "pupitre.fullname" . }}-secrets
          items:
            - key: OIDC_CLIENT_SECRET
              path: OIDC_CLIENT_SECRET
          {{- end }}
      {{- end }}
      - name: git-credentials
        secret:
          secretName: {{ .Values.api.gitCredentialsSecret | quote }}
          optional: true
      - name: tmp
        emptyDir: {}
      - name: uploads
        {{- if .Values.api.uploads.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "pupitre.uploadsClaimName" . }}
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- with .Values.api.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
