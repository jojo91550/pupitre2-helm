apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pupitre.fullname" . }}-api-config
  labels:
    {{- include "pupitre.api.labels" . | nindent 4 }}
data:
  # The keys of the user-service and course-service ConfigMaps of
  # genesary/pupitre-helm, merged; the service URLs are gone.
  config.yaml: |
    port: {{ .Values.api.service.port }}
    jwtExpiryHours: {{ .Values.api.env.JWT_EXPIRY_HOURS }}
    dbMaxOpenConns: {{ .Values.api.env.DB_MAX_OPEN_CONNS }}
    dbMaxIdleConns: {{ .Values.api.env.DB_MAX_IDLE_CONNS }}
    corsOrigins:
      - "{{ include "pupitre.publicUrl" . }}"
    uploadsDir: "/data/uploads"
    gitCacheTtlMinutes: {{ .Values.api.env.GIT_CACHE_TTL }}
    gitCredentialsPath: "/etc/git-credentials/git-credentials.yaml"
    oauthRedirectBase: {{ .Values.sso.redirectBase | default (include "pupitre.publicUrl" .) | quote }}
    {{- if and .Values.sso.enabled .Values.sso.providers }}
    # Client secrets are deliberately omitted here — they are injected as
    # SSO_<ID>_CLIENT_SECRET env vars sourced from a Secret (see deployment.yaml).
    providers:
    {{- range .Values.sso.providers }}
      - id: {{ .id | quote }}
        name: {{ .name | quote }}
        {{- if .clientId }}
        clientId: {{ .clientId | quote }}
        {{- end }}
        {{- if .issuerUrl }}
        issuerUrl: {{ .issuerUrl | quote }}
        {{- end }}
    {{- end }}
    {{- end }}
