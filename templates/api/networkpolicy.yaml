{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pupitre.fullname" . }}-api
  labels:
    {{- include "pupitre.api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pupitre.api.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # From the Ingress controller or Gateway, and Prometheus.
    - ports:
        - port: {{ .Values.api.service.port }}
  egress:
    {{- if .Values.postgresql.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "pupitre.postgresql.selectorLabels" . | nindent 14 }}
      ports:
        - port: 5432
    {{- end }}
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Git repositories, an external database, the OIDC provider, GitLab
    {{- with .Values.networkPolicy.apiEgressPorts }}
    - ports:
        {{- range . }}
        - port: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
