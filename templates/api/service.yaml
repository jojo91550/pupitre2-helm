apiVersion: v1
kind: Service
metadata:
  name: {{ include "pupitre.fullname" . }}-api
  labels:
    {{- include "pupitre.api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if .Values.api.service.nodePort }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
  selector:
    {{- include "pupitre.api.selectorLabels" . | nindent 4 }}
