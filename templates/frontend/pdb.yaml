{{- if gt (int (.Values.frontend.replicaCount | default 1)) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "pupitre.fullname" . }}-frontend
  labels:
    {{- include "pupitre.frontend.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "pupitre.frontend.selectorLabels" . | nindent 6 }}
{{- end }}
