{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pupitre.fullname" . }}-frontend
  labels:
    {{- include "pupitre.frontend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pupitre.frontend.selectorLabels" . | nindent 6 }}
  # Static files only: the browser calls the API through the ingress, so the
  # frontend reaches nothing.
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 3000
  egress: []
{{- end }}
