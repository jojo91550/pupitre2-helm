suite: release secret
templates:
  - secret.yaml
release:
  name: pupitre
tests:
  - it: generates a 64-character JWT secret when none is set
    asserts:
      - matchRegex:
          path: stringData.JWT_SECRET
          pattern: '^[A-Za-z0-9]{64}$'

  - it: keeps the JWT secret of the release on upgrades
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: pupitre-secrets
            namespace: NAMESPACE
          data:
            JWT_SECRET: YW4tZXhpc3Rpbmctc2VjcmV0LW9mLW1vcmUtdGhhbi0zMi1jaGFyYWN0ZXJz
    asserts:
      - equal:
          path: stringData.JWT_SECRET
          value: an-existing-secret-of-more-than-32-characters

  - it: replaces the placeholder kept by a release of genesary/pupitre-helm
    kubernetesProvider:
      scheme:
        "v1/Secret":
          gvr:
            version: "v1"
            resource: "secrets"
          namespaced: true
      objects:
        - kind: Secret
          apiVersion: v1
          metadata:
            name: pupitre-secrets
            namespace: NAMESPACE
          data:
            JWT_SECRET: Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tdXNlLWEtbG9uZy1yYW5kb20tc3RyaW5n
    asserts:
      - matchRegex:
          path: stringData.JWT_SECRET
          pattern: '^[A-Za-z0-9]{64}$'

  - it: keeps an explicit JWT secret of 32 characters or more
    set:
      jwtSecret: 0123456789abcdef0123456789abcdef
    asserts:
      - equal:
          path: stringData.JWT_SECRET
          value: 0123456789abcdef0123456789abcdef

  - it: refuses a JWT secret shorter than 32 characters
    set:
      jwtSecret: too-short
    asserts:
      - failedTemplate:
          errorMessage: >-
            jwtSecret is shorter than 32 characters, which pupitre-api refuses:
            set a longer secret, or leave jwtSecret empty to have one generated.

  - it: refuses the placeholder of genesary/pupitre-helm
    set:
      jwtSecret: change-me-in-production-use-a-long-random-string
    asserts:
      - failedTemplate:
          errorMessage: >-
            jwtSecret is the placeholder of genesary/pupitre-helm, which
            pupitre-api refuses: set a random secret of at least 32 characters,
            or leave jwtSecret empty to have one generated.

  - it: leaves the JWT secret to an existing Secret
    set:
      jwtExistingSecret: my-jwt
    asserts:
      - notExists:
          path: stringData.JWT_SECRET

  - it: has no internal service secret
    asserts:
      - notExists:
          path: stringData.INTERNAL_SERVICE_SECRET

  - it: points DATABASE_URL at the bundled PostgreSQL
    set:
      postgresql.enabled: true
    asserts:
      - equal:
          path: stringData.DATABASE_URL
          value: postgres://pupitre:pupitre_secret@pupitre-postgresql.NAMESPACE.svc.cluster.local:5432/pupitre
